*{font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#f1f5f9;margin:0;overflow-x:hidden}
.fade-in{animation:fadeIn .3s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.slide-in{animation:slideIn .3s ease-out}
@keyframes slideIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.mobile-nav{transform:translateX(-100%);transition:transform .3s ease}
.mobile-nav.open{transform:translateX(0)}
.mobile-overlay{opacity:0;pointer-events:none;transition:opacity .3s ease}
.mobile-overlay.open{opacity:1;pointer-events:all}
.touch-target{min-height:44px;min-width:44px}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
input,select,textarea{font-size:16px!important}
.login-bg{background:linear-gradient(-45deg,#0f172a,#1e3a8a,#312e81,#1e40af,#0f172a);background-size:400% 400%;animation:gradientShift 15s ease infinite;position:relative;overflow:hidden}
@keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.login-bg::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(255,255,255,.05) 1px,transparent 1px);background-size:50px 50px;animation:moveGrid 20s linear infinite}
@keyframes moveGrid{0%{transform:translate(0,0)}100%{transform:translate(50px,50px)}}
.floating-shape{position:absolute;border-radius:50%;background:rgba(255,255,255,.05);animation:float 20s infinite ease-in-out}
@keyframes float{0%,100%{transform:translateY(0) translateX(0)}25%{transform:translateY(-30px) translateX(20px)}50%{transform:translateY(-20px) translateX(-20px)}75%{transform:translateY(10px) translateX(10px)}}
.glass-card{background:rgba(255,255,255,.95);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.2)}
.notice-red{background:linear-gradient(135deg,#fee2e2,#fecaca);border:2px solid #ef4444}
.notice-green{background:linear-gradient(135deg,#d1fae5,#a7f3d0);border:2px solid #10b981}
.notice-amber{background:linear-gradient(135deg,#fef3c7,#fde68a);border:2px solid #f59e0b}
.pulse-dot{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@media(max-width:768px){.sidebar-desktop{display:none!important}}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;left:0;top:0;width:100%}.no-print{display:none!important}}
</style>

function renderRevenueSection(myTrans){const revenues=myTrans.filter(t=>t.type==='revenue');const total=revenues.reduce((s,t)=>s+t.amount,0);const myStock=store.stock.filter(s=>s.userId===store.currentUser.id);const myCustomers=store.customers.filter(c=>c.userId===store.currentUser.id);return `<div class="fade-in space-y-6"><div class="flex justify-between items-center flex-wrap gap-3"><div><h1 class="text-2xl font-bold text-gray-800">${t('revenueTitle')}</h1><p class="text-sm text-gray-500">${t('sellStock')}</p></div><div class="bg-emerald-100 px-4 py-2 rounded-xl"><p class="text-xs text-emerald-600">${t('total')}</p><p class="text-xl font-bold text-emerald-700">$${total.toLocaleString()}</p></div></div><div class="bg-white p-4 md:p-6 rounded-2xl shadow-sm"><h3 class="font-bold text-gray-700 mb-4">${t('newSaleTitle')}</h3><div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4"><div><label class="block text-sm font-medium text-gray-700 mb-1">${t('customers')}</label><select id="revCustomer" onchange="handleRevCustomerChange(this.value)" class="w-full px-4 py-2 border border-gray-200 rounded-xl outline-none"><option value="">${t('selectCustomer')}</option>${myCustomers.map(c=>`<option value="${c.id}">${c.name} - ${c.phone}</option>`).join('')}<option value="__new__" class="font-bold text-emerald-600">${t('newCustomerOpt')}</option></select></div><div><label class="block text-sm font-medium text-gray-700 mb-1">${t('stock')} (${t('selectFromStock')})</label><select id="revStock" onchange="updateRevPrice()" class="w-full px-4 py-2 border border-gray-200 rounded-xl outline-none"><option value="">${t('selectStock')}</option>${myStock.map(s=>`<option value="${s.id}" data-price="${s.sellingPrice}" data-qty="${s.quantity}">${s.name} (Qty: ${s.quantity}) - $${s.sellingPrice}</option>`).join('')}</select></div></div><div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4"><div><label class="block text-sm font-medium text-gray-700 mb-1">${t('qty')}</label><input type="number" id="revQty" value="1" min="1" onchange="updateRevTotal()" class="w-full px-4 py-2 border border-gray-200 rounded-xl outline-none"/></div><div><label class="block text-sm font-medium text-gray-700 mb-1">${t('price')}</label><input type="number" step="0.01" id="revPrice" onchange="updateRevTotal()" class="w-full px-4 py-2 border border-gray-200 rounded-xl outline-none" placeholder="0.00"/></div><div><label class="block text-sm font-medium text-gray-700 mb-1">${t('total')}</label><input type="number" id="revTotal" readonly class="w-full px-4 py-2 border border-gray-200 rounded-xl bg-gray-50 outline-none font-bold text-emerald-600" placeholder="0.00"/></div></div><div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4"><div><label class="block text-sm font-medium text-gray-700 mb-1">${t('paid')}</label><input type="number" step="0.01" id="revPaid" class="w-full px-4 py-2 border border-gray-200 rounded-xl outline-none" placeholder="0.00"/><p class="text-xs text-gray-500 mt-1">${t('ifLess')}</p></div><div><label class="block text-sm font-medium text-gray-700 mb-1">${t('category')}</label><select id="revCategory" class="w-full px-4 py-2 border border-gray-200 rounded-xl outline-none"><option value="Sales">${t('sales')}</option><option value="Services">${t('services')}</option><option value="Other Income">${t('otherIncome')}</option></select></div></div><button onclick="addRevenue()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 rounded-xl cursor-pointer shadow-lg touch-target">${t('sellCreate')}</button></div><div class="bg-white rounded-2xl shadow-sm overflow-hidden"><div class="table-scroll"><table class="w-full min-w-[400px]"><thead class="bg-gray-50"><tr><th class="p-4 text-left text-xs font-semibold text-gray-500">${t('dateLabel')}</th><th class="p-4 text-left text-xs font-semibold text-gray-500">${t('categoryLabel')}</th><th class="p-4 text-right text-xs font-semibold text-gray-500">${t('amountLabel')}</th></tr></thead><tbody class="divide-y">${revenues.map(tt=>`<tr class="hover:bg-gray-50"><td class="p-4 text-sm">${tt.date}</td><td class="p-4 text-sm">${tt.category}</td><td class="p-4 text-sm text-right font-bold text-emerald-600">+$${tt.amount}</td></tr>`).join('')}${revenues.length===0?`<tr><td colspan="3" class="p-8 text-center text-gray-400">${t('noRevenue')}</td></tr>`:''}</tbody></table></div></div></div>`}

function handleRevCustomerChange(value){if(value==='__new__'){store.pendingCustomerTab='revenue';openCustomerModal();const sel=document.getElementById('revCustomer');if(sel)sel.value=''}}
function handleInvCustomerChange(value){if(value==='__new__'){store.pendingCustomerTab='invoice';openCustomerModal();const sel=document.getElementById('invCustomer');if(sel)sel.value=''}}

function updateRevPrice(){const sel=document.getElementById('revStock');if(!sel)return;const opt=sel.options[sel.selectedIndex];if(opt&&opt.dataset.price){document.getElementById('revPrice').value=opt.dataset.price;updateRevTotal()}}
function updateRevTotal(){const qty=parseFloat(document.getElementById('revQty').value)||0;const price=parseFloat(document.getElementById('revPrice').value)||0;document.getElementById('revTotal').value=(qty*price).toFixed(2)}

function renderExpensesSection(myTrans){const expenses=myTrans.filter(t=>t.type==='expense');const total=expenses.reduce((s,t)=>s+t.amount,0);return `<div class="fade-in space-y-6"><div class="flex justify-between items-center flex-wrap gap-3"><div><h1 class="text-2xl font-bold text-gray-800">${t('expenseTitle')}</h1><p class="text-sm text-gray-500">${t('recordExpense')}</p></div><div class="bg-red-100 px-4 py-2 rounded-xl"><p class="text-xs text-red-600">${t('total')}</p><p class="text-xl font-bold text-red-700">$${total.toLocaleString()}</p></div></div><div class="bg-white p-4 md:p-6 rounded-2xl shadow-sm"><h3 class="font-bold text-gray-700 mb-4">${t('newExpenseTitle')}</h3><div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4"><div><label class="block text-sm font-medium text-gray-700 mb-1">${t('category')}</label><select id="expCategory" onchange="toggleExpenseDescription()" class="w-full px-4 py-2 border border-gray-200 rounded-xl outline-none"><option value="Rent">${t('rent')}</option><option value="Stock">${t('stockCat')}</option><option value="Utilities">${t('utilities')}</option><option value="Salary">${t('salary')}</option><option value="Other Expense">${t('other')}</option></select></div><div><label class="block text-sm font-medium text-gray-700 mb-1">${t('amount')}</label><input type="number" step="0.01" id="expAmount" class="w-full px-4 py-2 border border-gray-200 rounded-xl outline-none" placeholder="0.00"/></div></div><div class="mb-4"><label class="block text-sm font-medium text-gray-700 mb-1">${t('description')}</label><textarea id="expDescription" rows="2" class="w-full px-4 py-2 border border-gray-200 rounded-xl outline-none" placeholder="..."></textarea></div><button onclick="addExpense()" class="w-full bg-red-600 hover:bg-red-700 text-white font-medium py-3 rounded-xl cursor-pointer shadow-lg touch-target">${t('saveExpense')}</button></div><div class="bg-white rounded-2xl shadow-sm overflow-hidden"><div class="table-scroll"><table class="w-full min-w-[500px]"><thead class="bg-gray-50"><tr><th class="p-4 text-left text-xs font-semibold text-gray-500">${t('dateLabel')}</th><th class="p-4 text-left text-xs font-semibold text-gray-500">${t('categoryLabel')}</th><th class="p-4 text-left text-xs font-semibold text-gray-500">${t('descLabel')}</th><th class="p-4 text-right text-xs font-semibold text-gray-500">${t('amountLabel')}</th></tr></thead><tbody class="divide-y">${expenses.map(tt=>`<tr class="hover:bg-gray-50"><td class="p-4 text-sm">${tt.date}</td><td class="p-4 text-sm">${tt.category}</td><td class="p-4 text-sm text-gray-600 italic">${tt.description||'-'}</td><td class="p-4 text-sm text-right font-bold text-red-600">-$${tt.amount}</td></tr>`).join('')}${expenses.length===0?`<tr><td colspan="4" class="p-8 text-center text-gray-400">${t('noExpense')}</td></tr>`:''}</tbody></table></div></div></div>`}

function toggleExpenseDescription(){const category=document.getElementById('expCategory').value;const descInput=document.getElementById('expDescription');if(category==='Other Expense'){descInput.placeholder=store.lang==='so'?'Qor waxa aad ku bixisay lacagtaan...':'Describe what you spent on...';descInput.required=true}else{descInput.placeholder='...';descInput.required=false}}

function renderStockSection(myStock){const totalValue=myStock.reduce((s,item)=>s+(item.quantity*item.sellingPrice),0);const lowStockItems=myStock.filter(s=>s.quantity<=s.minQty);const searchQuery=store.stockSearch.toLowerCase();const filteredStock=myStock.filter(s=>s.name.toLowerCase().includes(searchQuery));return `<div class="fade-in space-y-6"><div class="flex justify-between items-center flex-wrap gap-3"><div><h1 class="text-2xl font-bold text-gray-800">${t('stockTitle')}</h1><p class="text-sm text-gray-500">${lowStockItems.length>0?`<span class="text-red-600 font-medium">⚠️ ${lowStockItems.length} ${t('stockAlert')}</span>`:t('allStockGood')}</p></div><div class="flex space-x-3"><div class="bg-purple-100 px-4 py-2 rounded-xl"><p class="text-xs text-purple-600">${t('stockValue')}</p><p class="text-xl font-bold text-purple-700">$${totalValue.toLocaleString()}</p></div><button onclick="openStockModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl flex items-center space-x-2 cursor-pointer touch-target">${icons.plus}<span class="font-medium">${t('addStockBtn')}</span></button></div></div><div class="bg-white p-4 rounded-2xl shadow-sm"><div class="relative"><div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">${icons.search}</div><input type="text" id="stockSearchInput" value="${store.stockSearch}" oninput="searchStock(this.value)" placeholder="${t('searchStock')}" class="w-full pl-10 pr-4 py-2 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500"/></div></div><div class="bg-white rounded-2xl shadow-sm overflow-hidden"><div class="table-scroll"><table class="w-full min-w-[700px]"><thead class="bg-gray-50"><tr><th class="p-4 text-left text-xs font-semibold text-gray-500">${t('name')}</th><th class="p-4 text-left text-xs font-semibold text-gray-500">${t('quantity')}</th><th class="p-4 text-left text-xs font-semibold text-gray-500">${t('minLabel')}</th><th class="p-4 text-left text-xs font-semibold text-gray-500">${t('costLabel')}</th><th class="p-4 text-left text-xs font-semibold text-gray-500">${t('sellLabel')}</th><th class="p-4 text-left text-xs font-semibold text-gray-500">${t('status')}</th><th class="p-4 text-right text-xs font-semibold text-gray-500">${t('actionLabel2')}</th></tr></thead><tbody class="divide-y">${filteredStock.map(s=>{const isLow=s.quantity<=s.minQty;return `<tr class="hover:bg-gray-50 ${isLow?'bg-red-50':''}"><td class="p-4 text-sm font-medium">${s.name}</td><td class="p-4 text-sm font-bold">${s.quantity}</td><td class="p-4 text-sm text-gray-600">${s.minQty}</td><td class="p-4 text-sm text-red-600">$${s.costPrice}</td><td class="p-4 text-sm text-emerald-600 font-medium">$${s.sellingPrice}</td><td class="p-4">${isLow?`<span class="px-2 py-1 rounded-full text-xs font-medium bg-red-100 text-red-700 pulse-dot">${t('low')}</span>`:`<span class="px-2 py-1 rounded-full text-xs font-medium bg-green-100 text-green-700">${t('ok')}</span>`}</td><td class="p-4 text-right"><button onclick="deleteStock('${s.id}')" class="text-red-500 hover:text-red-700 cursor-pointer touch-target">${icons.trash}</button></td></tr>`}).join('')}${filteredStock.length===0?`<tr><td colspan="7" class="p-8 text-center text-gray-400">${t('noStock')}</td></tr>`:''}</tbody></table></div></div></div>`}

function searchStock(query){store.stockSearch=query;render()}

function renderProfitSection(revenue,expenses,profit){const margin=revenue>0?((profit/revenue)*100).toFixed(1):0;return `<div class="fade-in space-y-6"><div class="mb-2"><h1 class="text-2xl font-bold text-gray-800">${t('profitTitle')}</h1><p class="text-sm text-gray-500">${t('profitAnalysis')}</p></div><div class="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6"><div class="bg-white p-4 md:p-6 rounded-2xl shadow-sm"><p class="text-gray-500 text-sm">${t('revenue')}</p><p class="text-2xl md:text-3xl font-bold text-emerald-600 mt-2">$${revenue.toLocaleString()}</p></div><div class="bg-white p-4 md:p-6 rounded-2xl shadow-sm"><p class="text-gray-500 text-sm">${t('expenses')}</p><p class="text-2xl md:text-3xl font-bold text-red-600 mt-2">$${expenses.toLocaleString()}</p></div><div class="bg-white p-4 md:p-6 rounded-2xl shadow-sm"><p class="text-gray-500 text-sm">${t('profit')}</p><p class="text-2xl md:text-3xl font-bold ${profit>=0?'text-blue-600':'text-red-600'} mt-2">$${profit.toLocaleString()}</p><p class="text-xs text-gray-500 mt-2">${t('margin')}: ${margin}%</p></div></div><div class="bg-white p-4 md:p-6 rounded-2xl shadow-sm"><h3 class="font-bold text-gray-700 mb-4">${t('comparison')}</h3><div class="h-64"><canvas id="profitChart"></canvas></div></div></div>`}

function renderCustomersSection(myCustomers){const totalDebt=myCustomers.reduce((s,c)=>s+c.balance,0);const searchQuery=store.customerSearch.toLowerCase();const filteredCustomers=myCustomers.filter(c=>c.name.toLowerCase().includes(searchQuery)||c.phone.includes(searchQuery));return `<div class="fade-in space-y-6"><div class="flex justify-between items-center flex-wrap gap-3"><div><h1 class="text-2xl font-bold text-gray-800">${t('customerTitle')}</h1><p class="text-sm text-gray-500">${t('manageCustomers')}</p></div><div class="flex space-x-3"><div class="bg-amber-100 px-4 py-2 rounded-xl"><p class="text-xs text-amber-600">${t('totalDebts')}</p><p class="text-xl font-bold text-amber-700">$${totalDebt.toLocaleString()}</p></div><button onclick="openCustomerModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl flex items-center space-x-2 cursor-pointer touch-target">${icons.plus}<span class="font-medium">${t('addCustomerBtn')}</span></button></div></div><div class="bg-white p-4 rounded-2xl shadow-sm"><div class="relative"><div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">${icons.search}</div><input type="text" id="customerSearchInput" value="${store.customerSearch}" oninput="searchCustomer(this.value)" placeholder="${t('searchCustomer')}" class="w-full pl-10 pr-4 py-2 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500"/></div></div><div class="bg-white rounded-2xl shadow-sm overflow-hidden"><div class="table-scroll"><table class="w-full min-w-[600px]"><thead class="bg-gray-50"><tr><th class="p-4 text-left text-xs font-semibold text-gray-500">${t('name')}</th><th class="p-4 text-left text-xs font-semibold text-gray-500">${t('phone')}</th><th class="p-4 text-left text-xs font-semibold text-gray-500">${t('dateLabel')}</th><th class="p-4 text-left text-xs font-semibold text-gray-500">${t('debts')}</th><th class="p-4 text-right text-xs font-semibold text-gray-500">${t('actionLabel2')}</th></tr></thead><tbody class="divide-y">${filteredCustomers.map(c=>`<tr class="hover:bg-gray-50"><td class="p-4"><div class="flex items-center space-x-3"><div class="w-9 h-9 bg-emerald-100 rounded-lg flex items-center justify-center text-emerald-600 font-bold text-sm">${c.name.charAt(0)}</div><span class="font-medium text-gray-800">${c.name}</span></div></td><td class="p-4 text-sm text-gray-600">${c.phone}</td><td class="p-4 text-sm text-gray-600">${c.createdAt}</td><td class="p-4"><span class="px-2 py-1 rounded-full text-xs font-medium ${c.balance>0?'bg-amber-100 text-amber-700':'bg-green-100 text-green-700'}">$${c.balance}</span></td><td class="p-4 text-right"><div class="flex items-center justify-end space-x-2">${c.balance>0?`<button onclick="openDebtModal('${c.id}')" class="text-sm px-3 py-1.5 rounded-lg bg-emerald-100 text-emerald-700 hover:bg-emerald-200 cursor-pointer font-medium touch-target">${t('pay')}</button>`:''}<button onclick="deleteCustomer('${c.id}')" class="text-red-500 hover:text-red-700 cursor-pointer text-sm touch-target">${t('delete')}</button></div></td></tr>`).join('')}${filteredCustomers.length===0?`<tr><td colspan="5" class="p-8 text-center text-gray-400">${t('noCustomer')}</td></tr>`:''}</tbody></table></div></div></div>`}

function searchCustomer(query){store.customerSearch=query;render()}

function renderInvoicesSection(){const myInvoices=store.invoices.filter(inv=>inv.userId===store.currentUser.id);return `<div class="fade-in space-y-6"><div class="flex justify-between items-center flex-wrap gap-3"><div><h1 class="text-2xl font-bold text-gray-800">${t('invoiceTitle2')}</h1><p class="text-sm text-gray-500">${t('createPrint')}</p></div><button onclick="openInvoiceModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl flex items-center space-x-2 cursor-pointer touch-target">${icons.plus}<span class="font-medium">${t('addInvoiceBtn')}</span></button></div><div class="bg-white rounded-2xl shadow-sm overflow-hidden"><div class="table-scroll"><table class="w-full min-w-[700px]"><thead class="bg-gray-50"><tr><th class="p-4 text-left text-xs font-semibold text-gray-500">Invoice #</th><th class="p-4 text-left text-xs font-semibold text-gray-500">${t('customers')}</th><th class="p-4 text-left text-xs font-semibold text-gray-500">${t('dateLabel')}</th><th class="p-4 text-left text-xs font-semibold text-gray-500">${t('grandTotal')}</th><th class="p-4 text-left text-xs font-semibold text-gray-500">${t('paidAmount')}</th><th class="p-4 text-left text-xs font-semibold text-gray-500">${t('statusLabel')}</th><th class="p-4 text-right text-xs font-semibold text-gray-500">${t('actionLabel')}</th></tr></thead><tbody class="divide-y">${myInvoices.map(inv=>{const cust=store.customers.find(c=>c.id===inv.customerId);const balance=inv.total-inv.paid;return `<tr class="hover:bg-gray-50"><td class="p-4 text-sm font-mono font-bold">#${inv.id.substr(0,6).toUpperCase()}</td><td class="p-4 text-sm">${cust?cust.name:'Unknown'}</td><td class="p-4 text-sm text-gray-600">${inv.date}</td><td class="p-4 text-sm font-bold">$${inv.total}</td><td class="p-4 text-sm text-emerald-600">$${inv.paid}</td><td class="p-4"><span class="px-2 py-1 rounded-full text-xs font-medium ${balance<=0?'bg-green-100 text-green-700':'bg-amber-100 text-amber-700'}">${balance<=0?t('paidStatus'):`⏳ $${balance} ${t('balance')}`}</span></td><td class="p-4 text-right"><button onclick="viewInvoice('${inv.id}')" class="text-emerald-600 hover:text-emerald-700 cursor-pointer text-sm font-medium touch-target">${t('viewPrint')}</button></td></tr>`}).join('')}${myInvoices.length===0?`<tr><td colspan="7" class="p-8 text-center text-gray-400">${t('noInvoice')}</td></tr>`:''}</tbody></table></div></div></div>`}

function renderReportsSection(revenue,expenses,profit,totalDebt){const myCustomers=store.customers.filter(c=>c.userId===store.currentUser.id);const myInvoices=store.invoices.filter(inv=>inv.userId===store.currentUser.id);const myStock=store.stock.filter(s=>s.userId===store.currentUser.id);const stockValue=myStock.reduce((s,item)=>s+(item.quantity*item.sellingPrice),0);const lowStock=myStock.filter(s=>s.quantity<=s.minQty).length;const paidInvoices=myInvoices.filter(inv=>inv.total<=inv.paid).length;const unpaidInvoices=myInvoices.filter(inv=>inv.total>inv.paid).length;return `<div class="fade-in space-y-6"><div class="mb-2"><h1 class="text-2xl font-bold text-gray-800">${t('reportsTitle')}</h1><p class="text-sm text-gray-500">${t('analyticsDesc')}</p></div><div class="grid grid-cols-2 md:grid-cols-4 gap-4"><div class="bg-white p-4 md:p-5 rounded-2xl shadow-sm border-l-4 border-emerald-500"><p class="text-gray-500 text-xs font-medium">${t('revenue')}</p><h3 class="text-xl md:text-2xl font-bold text-emerald-600 mt-1">$${revenue.toLocaleString()}</h3></div><div class="bg-white p-4 md:p-5 rounded-2xl shadow-sm border-l-4 border-red-500"><p class="text-gray-500 text-xs font-medium">${t('expenses')}</p><h3 class="text-xl md:text-2xl font-bold text-red-600 mt-1">$${expenses.toLocaleString()}</h3></div><div class="bg-white p-4 md:p-5 rounded-2xl shadow-sm border-l-4 border-amber-500"><p class="text-gray-500 text-xs font-medium">${t('debts')}</p><h3 class="text-xl md:text-2xl font-bold text-amber-600 mt-1">$${totalDebt.toLocaleString()}</h3></div><div class="bg-white p-4 md:p-5 rounded-2xl shadow-sm border-l-4 border-blue-500"><p class="text-gray-500 text-xs font-medium">${t('profit')}</p><h3 class="text-xl md:text-2xl font-bold ${profit>=0?'text-blue-600':'text-red-600'} mt-1">$${profit.toLocaleString()}</h3></div></div><div class="grid grid-cols-1 lg:grid-cols-2 gap-4 md:gap-6"><div class="bg-white p-4 md:p-6 rounded-2xl shadow-sm"><h3 class="font-bold text-gray-700 mb-4">${t('dakhliVs')}</h3><div class="h-64"><canvas id="reportBarChart"></canvas></div></div><div class="bg-white p-4 md:p-6 rounded-2xl shadow-sm"><h3 class="font-bold text-gray-700 mb-4">${t('split')}</h3><div class="h-64"><canvas id="reportPieChart"></canvas></div></div></div><div class="grid grid-cols-1 md:grid-cols-3 gap-4"><div class="bg-white p-4 md:p-5 rounded-2xl shadow-sm"><div class="flex items-center space-x-3 mb-2"><div class="w-10 h-10 bg-purple-100 rounded-lg flex items-center justify-center text-purple-600">${icons.box}</div><p class="text-sm text-gray-500">${t('stockValue')}</p></div><p class="text-2xl font-bold text-gray-800">$${stockValue.toLocaleString()}</p><p class="text-xs text-gray-500 mt-1">${myStock.length} items • ${lowStock>0?`<span class="text-red-600">${lowStock} ${t('low')}</span>`:'✅ OK'}</p></div><div class="bg-white p-4 md:p-5 rounded-2xl shadow-sm"><div class="flex items-center space-x-3 mb-2"><div class="w-10 h-10 bg-green-100 rounded-lg flex items-center justify-center text-green-600">${icons.invoice}</div><p class="text-sm text-gray-500">${t('invoices')}</p></div><p class="text-2xl font-bold text-gray-800">${myInvoices.length}</p><p class="text-xs text-gray-500 mt-1"><span class="text-green-600">${paidInvoices} paid</span> • <span class="text-amber-600">${unpaidInvoices} unpaid</span></p></div><div class="bg-white p-4 md:p-5 rounded-2xl shadow-sm"><div class="flex items-center space-x-3 mb-2"><div class="w-10 h-10 bg-blue-100 rounded-lg flex items-center justify-center text-blue-600">${icons.customer}</div><p class="text-sm text-gray-500">${t('customers')}</p></div><p class="text-2xl font-bold text-gray-800">${myCustomers.length}</p><p class="text-xs text-gray-500 mt-1">${myCustomers.filter(c=>c.balance>0).length} with debt</p></div></div><div class="bg-white p-4 md:p-6 rounded-2xl shadow-sm"><h3 class="font-bold text-gray-700 mb-4">${t('summaryReport')}</h3><div class="space-y-3"><div class="flex justify-between items-center p-3 bg-gray-50 rounded-xl"><span class="text-gray-600">${t('totalRev')}</span><span class="font-bold text-emerald-600">$${revenue.toLocaleString()}</span></div><div class="flex justify-between items-center p-3 bg-gray-50 rounded-xl"><span class="text-gray-600">${t('totalExp')}</span><span class="font-bold text-red-600">$${expenses.toLocaleString()}</span></div><div class="flex justify-between items-center p-3 bg-gray-50 rounded-xl"><span class="text-gray-600">${t('outstanding')}</span><span class="font-bold text-amber-600">$${totalDebt.toLocaleString()}</span></div><div class="flex justify-between items-center p-3 bg-emerald-50 rounded-xl border-2 border-emerald-200"><span class="text-gray-800 font-semibold">${t('netProfit')}</span><span class="font-bold text-emerald-700 text-xl">$${profit.toLocaleString()}</span></div></div></div></div>`}

function viewInvoice(invId){const inv=store.invoices.find(i=>i.id===invId);if(!inv)return;const cust=store.customers.find(c=>c.id===inv.customerId);const user=store.users.find(u=>u.id===store.currentUser.id);const balance=inv.total-inv.paid;const printContent=`<div id="printArea" class="bg-white p-8 max-w-2xl mx-auto"><div class="border-b-2 border-gray-800 pb-6 mb-6"><div class="flex justify-between items-start"><div><h1 class="text-3xl font-black text-gray-800">${user?user.businessName:'My Business'}</h1><p class="text-sm text-gray-600 mt-1">${t('invoiceTitle')}</p></div><div class="text-right"><p class="text-sm text-gray-500">Invoice #</p><p class="text-xl font-bold text-gray-800">#${inv.id.substr(0,6).toUpperCase()}</p><p class="text-sm text-gray-500 mt-2">${t('dateLabel')}: ${inv.date}</p></div></div></div><div class="mb-6"><p class="text-sm text-gray-500 mb-1">${t('customerLabel')}</p><p class="text-lg font-bold text-gray-800">${cust?cust.name:'Unknown'}</p><p class="text-sm text-gray-600">📞 ${cust?cust.phone:''}</p></div><table class="w-full mb-6"><thead class="border-b-2 border-gray-800"><tr><th class="text-left py-2 text-sm font-semibold">${t('item')}</th><th class="text-center py-2 text-sm font-semibold">${t('qtyLabel')}</th><th class="text-right py-2 text-sm font-semibold">${t('priceLabel')}</th><th class="text-right py-2 text-sm font-semibold">${t('totalLabel')}</th></tr></thead><tbody>${inv.items.map(item=>`<tr class="border-b border-gray-200"><td class="py-3 text-sm">${item.name}</td><td class="py-3 text-sm text-center">${item.qty}</td><td class="py-3 text-sm text-right">$${item.price.toFixed(2)}</td><td class="py-3 text-sm text-right font-medium">$${(item.qty*item.price).toFixed(2)}</td></tr>`).join('')}</tbody></table><div class="border-t-2 border-gray-800 pt-4"><div class="flex justify-between mb-2"><span class="text-gray-600">${t('grandTotal')}:</span><span class="font-bold">$${inv.total.toFixed(2)}</span></div><div class="flex justify-between mb-2"><span class="text-gray-600">${t('paidAmount')}:</span><span class="font-bold text-emerald-600">$${inv.paid.toFixed(2)}</span></div>${balance>0?`<div class="flex justify-between pt-2 border-t border-gray-300"><span class="text-gray-800 font-semibold">${t('balance')}:</span><span class="font-bold text-red-600 text-lg">$${balance.toFixed(2)}</span></div>`:`<div class="flex justify-between pt-2 border-t border-gray-300"><span class="text-gray-800 font-semibold">${t('statusLabel')}:</span><span class="font-bold text-emerald-600">${t('paidStatus')}</span></div>`}</div><div class="mt-8 pt-6 border-t border-gray-300 text-center"><p class="text-sm text-gray-500">${t('thanks')}</p><p class="text-xs text-gray-400 mt-1">${t('generatedBy')}</p></div></div><div class="no-print fixed bottom-0 left-0 right-0 bg-white border-t p-4 flex justify-center space-x-4 shadow-lg"><button onclick="window.print()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-xl font-medium cursor-pointer flex items-center space-x-2 touch-target">${icons.print}<span>${t('print')}</span></button><button onclick="shareInvoice('${invId}')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2 rounded-xl font-medium cursor-pointer flex items-center space-x-2 touch-target">${icons.share}<span>${t('share')}</span></button><button onclick="render()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-6 py-2 rounded-xl font-medium cursor-pointer touch-target">${t('close')}</button></div>`;document.getElementById('app').innerHTML=`<div class="min-h-screen bg-gray-100 p-4"><div class="no-print mb-4 flex items-center space-x-4"><button onclick="render()" class="text-gray-600 hover:text-gray-800 cursor-pointer touch-target">${t('back')}</button><h2 class="font-bold text-gray-800">Invoice #${inv.id.substr(0,6).toUpperCase()}</h2></div>${printContent}</div>`}

function shareInvoice(invId){const inv=store.invoices.find(i=>i.id===invId);const cust=store.customers.find(c=>c.id===inv.customerId);const user=store.users.find(u=>u.id===store.currentUser.id);const text=`Invoice from ${user?user.businessName:'My Business'}\nCustomer: ${cust?cust.name:''}\nTotal: $${inv.total}\nDate: ${inv.date}`;if(navigator.share){navigator.share({title:'Invoice',text:text}).catch(()=>{})}else{navigator.clipboard.writeText(text).then(()=>alert('✅ Invoice copied!'))}}

let chartInstances={};function destroyCharts(){Object.values(chartInstances).forEach(c=>c&&c.destroy());chartInstances={}}
function initAdminCharts(){destroyCharts();if(store.adminTab==='dashboard'){const barCtx=document.getElementById('adminBarChart');if(barCtx)chartInstances.adminBar=new Chart(barCtx,{type:'bar',data:{labels:['Month 1','Month 2','Month 3'],datasets:[{data:[0,0,0],backgroundColor:'#3b82f6',borderRadius:8}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}});const pieCtx=document.getElementById('adminPieChart');if(pieCtx)chartInstances.adminPie=new Chart(pieCtx,{type:'doughnut',data:{labels:[t('open'),t('closed')],datasets:[{data:[store.users.filter(u=>u.isActive).length||1,store.users.filter(u=>!u.isActive).length||0],backgroundColor:['#10b981','#ef4444'],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false}})}if(store.adminTab==='reports'){const ctx=document.getElementById('adminReportBar');if(ctx){const rev=store.transactions.filter(t=>t.type==='revenue').reduce((s,t)=>s+t.amount,0);const exp=store.transactions.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);chartInstances.adminRep=new Chart(ctx,{type:'bar',data:{labels:[t('revenue'),t('expenses')],datasets:[{data:[rev,exp],backgroundColor:['#10b981','#ef4444'],borderRadius:8}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}})}}}
function initUserCharts(){destroyCharts();if(store.userTab==='profit'){const myTrans=store.transactions.filter(t=>t.userId===store.currentUser.id);const rev=myTrans.filter(t=>t.type==='revenue').reduce((s,t)=>s+t.amount,0);const exp=myTrans.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);const ctx=document.getElementById('profitChart');if(ctx)chartInstances.profit=new Chart(ctx,{type:'bar',data:{labels:[t('revenue'),t('expenses'),t('profit')],datasets:[{data:[rev,exp,rev-exp],backgroundColor:['#10b981','#ef4444','#3b82f6'],borderRadius:8}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}})}if(store.userTab==='reports'){const myTrans=store.transactions.filter(t=>t.userId===store.currentUser.id);const rev=myTrans.filter(t=>t.type==='revenue').reduce((s,t)=>s+t.amount,0);const exp=myTrans.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);const myCustomers=store.customers.filter(c=>c.userId===store.currentUser.id);const debt=myCustomers.reduce((s,c)=>s+c.balance,0);const barCtx=document.getElementById('reportBarChart');if(barCtx)chartInstances.repBar=new Chart(barCtx,{type:'bar',data:{labels:[t('revenue'),t('expenses'),t('debts')],datasets:[{data:[rev,exp,debt],backgroundColor:['#10b981','#ef4444','#f59e0b'],borderRadius:8}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}});const pieCtx=document.getElementById('reportPieChart');if(pieCtx)chartInstances.repPie=new Chart(pieCtx,{type:'doughnut',data:{labels:[t('revenue'),t('expenses'),t('debts')],datasets:[{data:[rev||1,exp||1,debt||1],backgroundColor:['#10b981','#ef4444','#f59e0b'],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false}})}}

function doLogin(){const username=document.getElementById('loginUser').value.trim();const password=document.getElementById('loginPass').value.trim();if(!username||!password){alert(t('fillUsernamePassword'));return}if(username==='admin'&&password==='admin'){store.currentUser={role:'admin',username:'Super Admin',password:'admin'};store.currentView='dashboard';store.adminTab='dashboard';render()}else{const user=store.users.find(u=>u.username===username&&u.password===password);if(user){store.currentUser={...user,role:'user'};store.currentView='dashboard';store.userTab='overview';render()}else{alert(t('usernameOrPasswordWrong'))}}}
function doLogout(){store.currentUser=null;store.currentView='login';store.mobileMenuOpen=false;destroyCharts();render()}
function setAdminTab(tab){store.adminTab=tab;store.mobileMenuOpen=false;render()}
function setUserTab(tab){store.userTab=tab;store.mobileMenuOpen=false;render()}
function openModal(){document.getElementById('userModal').classList.remove('hidden')}
function closeModal(){document.getElementById('userModal').classList.add('hidden')}
function createUser(){const bizName=document.getElementById('newBizName').value.trim();const username=document.getElementById('newUsername').value.trim();const password=document.getElementById('newPassword').value.trim();const days=parseInt(document.getElementById('newDays').value);const notice=document.getElementById('newNotice').value.trim();const noticeColor=document.getElementById('newNoticeColor').value;if(!bizName||!username||!password){alert(t('fillAll'));return}const endDate=new Date();endDate.setDate(endDate.getDate()+days);store.users.push({id:generateId(),username,password,businessName:bizName,subscriptionEnd:endDate.toISOString().split('T')[0],isActive:true,adminNotice:notice,noticeColor:noticeColor});closeModal();render()}

function closeNoticeModal(){document.getElementById('noticeModal').classList.add('hidden');noticeUserId=null}
function saveNotice(){const user=store.users.find(u=>u.id===noticeUserId);if(user){user.adminNotice=document.getElementById('noticeText').value;user.noticeColor=document.getElementById('noticeColor').value;alert(t('noticeSent2'))}closeNoticeModal();render()}
function openAdminPasswordModal(userId){adminPasswordUserId=userId;const user=store.users.find(u=>u.id===userId);document.getElementById('adminPasswordModal').classList.remove('hidden');document.getElementById('adminPassUsername').textContent=user?user.username:'';document.getElementById('adminNewPassword').value=''}
function closeAdminPasswordModal(){document.getElementById('adminPasswordModal').classList.add('hidden');adminPasswordUserId=null}
function changeUserPassword(){const newPass=document.getElementById('adminNewPassword').value.trim();if(!newPass||newPass.length<3){alert(t('passShort'));return}const user=store.users.find(u=>u.id===adminPasswordUserId);if(user){user.password=newPass;alert(`${t('userPassChanged')} ${user.username} ${t('wasChanged')}`)}closeAdminPasswordModal();render()}
function openAdminOwnPasswordModal(){document.getElementById('adminOwnPasswordModal').classList.remove('hidden');document.getElementById('adminOldPassword').value='';document.getElementById('adminNewPass').value='';document.getElementById('adminConfirmPass').value=''}
function closeAdminOwnPasswordModal(){document.getElementById('adminOwnPasswordModal').classList.add('hidden')}
function changeAdminPassword(){const oldP=document.getElementById('adminOldPassword').value;const newP=document.getElementById('adminNewPass').value;const confP=document.getElementById('adminConfirmPass').value;if(oldP!=='admin'){alert(t('passWrong'));return}if(newP!==confP){alert(t('passMismatch'));return}if(newP.length<3){alert(t('passShort'));return}store.currentUser.password=newP;closeAdminOwnPasswordModal();alert(t('adminPassChanged'));render()}
function openPasswordModal(){document.getElementById('passwordModal').classList.remove('hidden')}
function closePasswordModal(){document.getElementById('passwordModal').classList.add('hidden')}
function changePassword(){const oldP=document.getElementById('oldPassword').value;const newP=document.getElementById('newPassword').value;const confP=document.getElementById('confirmPassword').value;const user=store.users.find(u=>u.id===store.currentUser.id);if(!user)return;if(user.password!==oldP){alert(t('passWrong'));return}if(newP!==confP){alert(t('passMismatch'));return}if(newP.length<3){alert(t('passShort'));return}user.password=newP;store.currentUser.password=newP;closePasswordModal();alert(t('passwordChanged'));render()}
function openCustomerModal(){document.getElementById('customerModal').classList.remove('hidden')}
function closeCustomerModal(){document.getElementById('customerModal').classList.add('hidden')}
function addCustomer(){const name=document.getElementById('custName').value.trim();const phone=document.getElementById('custPhone').value.trim();if(!name||!phone){alert(t('fillAll'));return}const newCust={id:generateId(),userId:store.currentUser.id,name,phone,balance:0,createdAt:new Date().toISOString().split('T')[0]};store.customers.push(newCust);store.quickAddCustomerId=newCust.id;closeCustomerModal();alert(t('customerCreated'));render()}

function closeDebtModal(){document.getElementById('debtModal').classList.add('hidden');debtCustomerId=null}

function openStockModal(){document.getElementById('stockModal').classList.remove('hidden')}

function addStock(){const name=document.getElementById('stockName').value.trim();const qty=parseInt(document.getElementById('stockQty').value);const minQty=parseInt(document.getElementById('stockMin').value)||5;const costPrice=parseFloat(document.getElementById('stockCostPrice').value);const sellingPrice=parseFloat(document.getElementById('stockSellingPrice').value);if(!name||!qty||!costPrice||!sellingPrice){alert(t('fillAll'));return}const totalCost=qty*costPrice;store.transactions.push({id:generateId(),userId:store.currentUser.id,type:'expense',amount:totalCost,category:'Stock',description:`Soo iibsi: ${qty}x ${name} @ $${costPrice}`,date:new Date().toISOString().split('T')[0]});store.stock.push({id:generateId(),userId:store.currentUser.id,name,quantity:qty,minQty,costPrice,sellingPrice,date:new Date().toISOString().split('T')[0]});closeStockModal();alert(`${t('stockRecorded')}\n${t('costAdded')}: $${totalCost} ${t('addedToExpenses')}`);render()}
function deleteStock(id){store.stock=store.stock.filter(s=>s.id!==id);render()}

function addRevenue(){const customerId=document.getElementById('revCustomer').value;const stockId=document.getElementById('revStock').value;const qty=parseInt(document.getElementById('revQty').value);const price=parseFloat(document.getElementById('revPrice').value);const paid=parseFloat(document.getElementById('revPaid').value)||0;const category=document.getElementById('revCategory').value;if(!customerId||customerId==='__new__'){alert(t('selectCust'));return}if(!stockId){alert(t('selectStockItem'));return}if(!qty||qty<=0){alert(t('enterQty'));return}if(!price||price<=0){alert(t('enterPrice'));return}const stockItem=store.stock.find(s=>s.id===stockId);if(!stockItem){alert(t('selectStockItem'));return}if(stockItem.quantity<qty){alert(`${t('stockNotEnough')} ${stockItem.name} ${t('onlyLeft')} ${stockItem.quantity} ${t('ayaa haray')}`);return}const total=qty*price;const customer=store.customers.find(c=>c.id===customerId);const balance=total-paid;stockItem.quantity-=qty;store.transactions.push({id:generateId(),userId:store.currentUser.id,type:'revenue',amount:total,category:category,description:`${qty}x ${stockItem.name} → ${customer?customer.name:'Unknown'}`,date:new Date().toISOString().split('T')[0]});const invoice={id:generateId(),userId:store.currentUser.id,customerId:customerId,items:[{name:stockItem.name,qty:qty,price:price}],total:total,date:new Date().toISOString().split('T')[0],paid:paid};store.invoices.push(invoice);if(balance>0&&customer){customer.balance+=balance}let msg=`${t('saleSaved')}\n${t('invoiceNum')} #${invoice.id.substr(0,6).toUpperCase()}\n${t('total')}: $${total}\n${t('paidAmount')}: $${paid}`;if(balance>0){msg+=`\n${t('debtRemaining')} $${balance}`}else{msg+=`\n${t('fullyPaid')}`}alert(msg);render()}

function addExpense(){const amount=parseFloat(document.getElementById('expAmount').value);const category=document.getElementById('expCategory').value;const description=document.getElementById('expDescription').value.trim();if(category==='Other Expense'&&!description){alert(t('enterDesc'));return}if(!amount||amount<=0){alert(t('enterAmount'));return}store.transactions.push({id:generateId(),userId:store.currentUser.id,type:'expense',amount:amount,category:category,description:description,date:new Date().toISOString().split('T')[0]});render()}

function openInvoiceModal(){document.getElementById('invoiceModal').classList.remove('hidden');invItems.length=0;renderInvItemsList()}
function closeInvoiceModal(){document.getElementById('invoiceModal').classList.add('hidden')}

function updateInvFromStock(){const sel=document.getElementById('invStockItem');if(!sel)return;const opt=sel.options[sel.selectedIndex];if(opt&&opt.dataset.price){document.getElementById('invPrice').value=opt.dataset.price}}

const invItems=[];
function addInvItemFromStock(){const stockId=document.getElementById('invStockItem').value;const qty=parseInt(document.getElementById('invQty').value);const price=parseFloat(document.getElementById('invPrice').value);if(!stockId){alert(t('selectStockItem'));return}if(!qty||qty<=0){alert(t('enterQty'));return}if(!price||price<=0){alert(t('enterPrice'));return}const stockItem=store.stock.find(s=>s.id===stockId);if(!stockItem){alert(t('selectStockItem'));return}if(stockItem.quantity<qty){alert(`${t('stockNotEnough')} ${stockItem.name}`);return}invItems.push({stockId:stockId,name:stockItem.name,qty:qty,price:price});renderInvItemsList();document.getElementById('invStockItem').value='';document.getElementById('invQty').value='1';document.getElementById('invPrice').value=''}

function renderInvItemsList(){const list=document.getElementById('invItemsList');let total=0;let html='';invItems.forEach((item,idx)=>{const itemTotal=item.qty*item.price;total+=itemTotal;html+=`<div class="flex items-center justify-between p-2 bg-white rounded-lg border border-gray-200"><div class="flex-1"><p class="text-sm font-medium">${item.name}</p><p class="text-xs text-gray-500">${item.qty} x $${item.price} = $${itemTotal.toFixed(2)}</p></div><button onclick="removeInvItem(${idx})" class="text-red-500 hover:text-red-700 px-2 touch-target">✕</button></div>`});if(invItems.length===0){list.innerHTML=`<p class="text-sm text-gray-400 text-center py-2">${t('noData')}</p>`}else{list.innerHTML=html}const totalEl=document.getElementById('invGrandTotal');if(totalEl)totalEl.textContent='$'+total.toFixed(2)}

function removeInvItem(idx){invItems.splice(idx,1);renderInvItemsList()}

function createInvoice(){const customerId=document.getElementById('invCustomer').value;const paid=parseFloat(document.getElementById('invPaid').value)||0;if(!customerId||customerId==='__new__'){alert(t('selectCust'));return}if(invItems.length===0){alert(t('addOneItem'));return}let total=0;const finalItems=[];for(const item of invItems){const stockItem=store.stock.find(s=>s.id===item.stockId);if(stockItem){if(stockItem.quantity<item.qty){alert(`${t('stockNotEnough')} ${item.name}`);return}stockItem.quantity-=item.qty}const itemTotal=item.qty*item.price;total+=itemTotal;finalItems.push({name:item.name,qty:item.qty,price:item.price})}const balance=total-paid;const invoice={id:generateId(),userId:store.currentUser.id,customerId:customerId,items:finalItems,total:total,date:new Date().toISOString().split('T')[0],paid:paid};store.invoices.push(invoice);const customer=store.customers.find(c=>c.id===customerId);if(customer&&balance>0){customer.balance+=balance}store.transactions.push({id:generateId(),userId:store.currentUser.id,type:'revenue',amount:total,category:'Sales',description:`Invoice #${invoice.id.substr(0,6).toUpperCase()}`,date:new Date().toISOString().split('T')[0]});invItems.length=0;closeInvoiceModal();let msg=t('invoiceCreated2');if(balance>0){msg+=`\n${t('debtRemaining')} $${balance}`}else{msg+=`\n${t('fullyPaid')}`}alert(msg);render()}

render();
</script>
</body>
</html>
